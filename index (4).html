<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijote : planificateur de repas</title>
<meta name="description" content="Planifiez vos repas de la semaine, apprenez à cuisiner et obtenez votre liste de courses.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F1EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mijote">
<link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>(function(){var t=null;try{t=localStorage.getItem("mijote-theme")}catch(e){}var d=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=d;var m=document.querySelector('meta[name="theme-color"]');if(m&&d==="dark")m.content="#0E0F11"})();</script>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --font-display:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
  --font-sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F4F1EA;--bg-2:#EAE5DA;--surface:#FFFFFF;--surface-2:#FAF8F4;--raise:#FFFFFF;
  --ink:#15171A;--ink-2:#3A3D42;--muted:#5E626A;--line:#E5E0D5;--line-2:#D3CCBD;
  --accent:#EF5A2F;--accent-text:#B83B16;
  --primary:#15171A;--primary-ink:#FFFFFF;
  --ok:#2F9A63;--warn:#D9921A;--err:#D9481E;
  --scrim:rgba(14,15,17,.42);
  --shadow-sm:0 1px 2px rgba(21,23,26,.06),0 1px 1px rgba(21,23,26,.03);
  --shadow-md:0 14px 34px -16px rgba(21,23,26,.24),0 2px 6px -2px rgba(21,23,26,.06);
  --shadow-lg:0 40px 100px -30px rgba(21,23,26,.45),0 10px 30px -10px rgba(21,23,26,.15);
  --r-md:16px;--r-lg:22px;--r-xl:30px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.45,.64,1);
  --ease-in:cubic-bezier(.5,0,.75,0);
  --header-h:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E0F11;--bg-2:#1C1E22;--surface:#16181B;--surface-2:#1A1C20;--raise:#2B2E34;
  --ink:#F2EFE9;--ink-2:#CCC8C1;--muted:#9B9EA5;--line:#272A2F;--line-2:#383C43;
  --accent:#FF6A43;--accent-text:#FF916F;
  --primary:#F2EFE9;--primary-ink:#111214;
  --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 16px 38px -16px rgba(0,0,0,.75),0 2px 6px -2px rgba(0,0,0,.4);
  --shadow-lg:0 40px 100px -30px rgba(0,0,0,.85);
  color-scheme:dark;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + 80px)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 480px at 8% -8%,color-mix(in oklab,var(--accent) 11%,transparent),transparent 65%),
             radial-gradient(800px 520px at 100% 0%,color-mix(in oklab,#2C7BC0 8%,transparent),transparent 60%)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.025em;line-height:1.04;margin:0;font-optical-sizing:auto}
p{margin:0}
em{font-style:italic}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
input,label{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.vh,.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--primary);color:var(--primary-ink);padding:.6rem 1rem;border-radius:999px;font-weight:700;text-decoration:none}
.skip:focus{left:12px}
.shell{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.strong{font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm)}

/* ============================================================
   EN-TÊTE
   ============================================================ */
.topbar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:color-mix(in oklab,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid transparent;transition:border-color .3s,background-color .3s}
.topbar.is-scrolled{border-color:var(--line)}
.topbar-in{height:var(--header-h);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:-.035em}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;transition:transform .6s var(--ease-spring)}
.brand-mark svg{display:block}
.steam path{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.steam path:nth-child(2){animation-delay:.35s}.steam path:nth-child(3){animation-delay:.7s}
@keyframes steam{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.35;transform:translateY(-2px)}}
.brand:hover .brand-mark{transform:rotate(-10deg) scale(1.06)}
.tagline{margin-left:auto;color:var(--muted);font-size:.88rem;display:none}
@media(min-width:720px){.tagline{display:inline}}
.icon-btn{position:relative;width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .5s var(--ease-spring),border-color .2s,background-color .2s}
.icon-btn:hover{transform:rotate(-14deg) scale(1.05);border-color:var(--line-2)}
.icon-btn:active{transform:scale(.92)}
.theme-btn{margin-left:auto}
@media(min-width:720px){.theme-btn{margin-left:0}}
.theme-btn svg{position:absolute;transition:transform .6s var(--ease-spring),opacity .3s}
:root[data-theme="dark"] .i-moon,:root:not([data-theme="dark"]) .i-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:themeReveal .75s cubic-bezier(.16,1,.3,1)}
@keyframes themeReveal{from{clip-path:circle(0 at var(--vx,90%) var(--vy,0%))}to{clip-path:circle(150vmax at var(--vx,90%) var(--vy,0%))}}

/* ============================================================
   BOUTONS, CHIPS, ÉTIQUETTES
   ============================================================ */
.btn{--h:48px;position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:var(--h);padding:0 1.3rem;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.95rem;letter-spacing:-.005em;white-space:nowrap;transition:transform .45s var(--ease-spring),background-color .2s,border-color .2s,box-shadow .35s var(--ease-out),opacity .2s,color .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow-md)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-final{background:linear-gradient(120deg,#E4502A,#CF421A 55%,#B8380F);color:#fff;box-shadow:0 14px 34px -12px rgba(207,66,26,.65)}
.btn-final::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s var(--ease-out) infinite 1s}
@keyframes shine{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.btn .lbl{display:inline-block}
.btn .arrow{transition:transform .45s var(--ease-spring)}
.btn:hover .arrow{transform:translateX(3px)}
.btn.is-hidden{visibility:hidden}
.count-badge{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:.74rem;font-weight:800;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}

.chip{display:inline-flex;align-items:center;gap:.45rem;min-height:38px;padding:0 .95rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:.87rem;color:var(--ink-2);transition:transform .45s var(--ease-spring),background-color .25s,color .25s,border-color .25s}
.chip:hover{border-color:var(--line-2);transform:translateY(-1px);color:var(--ink)}
.chip:active{transform:scale(.95)}
.chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:800}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{opacity:.6;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag-cat{background:color-mix(in oklab,var(--c) 16%,var(--surface));border-color:transparent;color:color-mix(in oklab,var(--c) 62%,var(--ink))}
.level{--lc:#2F9A63;display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:.76rem;font-weight:800;letter-spacing:.02em;background:color-mix(in oklab,var(--lc) 16%,var(--surface));color:color-mix(in oklab,var(--lc) 60%,var(--ink));transition:background-color .4s,color .4s}
.level[data-l="equi"]{--lc:#D9921A}
.level[data-l="conf"]{--lc:#8A5CF0}

/* alertes / statut */
.tone-info{--tone:#2F9A63}.tone-warn{--tone:#D9921A}.tone-err{--tone:#D9481E}
.alert,.pool{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;font-size:.92rem;line-height:1.5;background:color-mix(in oklab,var(--tone) 11%,var(--surface));color:color-mix(in oklab,var(--tone) 45%,var(--ink));border:1px solid color-mix(in oklab,var(--tone) 22%,transparent);transition:background-color .4s,color .4s,border-color .4s}
.alert::before,.pool::before{content:"";flex:none;width:9px;height:9px;margin-top:7px;border-radius:50%;background:var(--tone);box-shadow:0 0 0 4px color-mix(in oklab,var(--tone) 22%,transparent);transition:background-color .4s,box-shadow .4s}
.alert strong,.pool strong{font-weight:800}

/* case à cocher animée */
.tick{width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);color:transparent;display:grid;place-items:center;transition:background-color .25s,border-color .25s,color .25s}
.tick svg path{stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .4s var(--ease-out) .05s}
input:checked + .tick,.opt input:checked + .opt-body .tick,.check input:checked + .tick{background:var(--ink);border-color:var(--ink);color:var(--bg);animation:pop .5s var(--ease-spring)}
input:checked + .tick svg path,.opt input:checked + .opt-body .tick svg path,.check input:checked + .tick svg path{stroke-dashoffset:0}
input:focus-visible + .tick{outline:2.5px solid var(--accent);outline-offset:3px}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

/* ============================================================
   FORMULAIRE
   ============================================================ */
.wizard{display:grid;gap:20px;padding:24px 0 48px;max-width:1080px;margin:0 auto}
@media(min-width:900px){.wizard{grid-template-columns:270px minmax(0,1fr);gap:44px;padding-top:52px;align-items:start}}
.wz-side{min-width:0}
@media(min-width:900px){.wz-side{position:sticky;top:calc(var(--header-h) + 36px)}}
.wz-title{display:none;font-family:var(--font-display);font-size:2.6rem;font-weight:600;letter-spacing:-.035em;line-height:1;margin:12px 0 12px}
.wz-title em{color:var(--accent-text)}
.wz-lead{display:none;color:var(--muted);font-size:.93rem;margin-bottom:24px}
@media(min-width:900px){.wz-title,.wz-lead{display:block}}

.stepper{position:relative;padding:5px;margin-top:10px;background:var(--bg-2);border-radius:999px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stepper::-webkit-scrollbar{display:none}
.stepper ol{position:relative;list-style:none;margin:0;padding:0;display:flex;gap:2px}
.stepper-pill{position:absolute;top:0;left:0;z-index:0;border-radius:999px;background:var(--raise);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transition:transform .6s var(--ease-spring),width .5s var(--ease-out),height .5s var(--ease-out);will-change:transform}
.step{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;color:var(--muted);font-weight:700;font-size:.88rem;white-space:nowrap;text-align:left;transition:color .3s}
.step:hover{color:var(--ink)}
.step-n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--surface);color:var(--muted);border:1px solid var(--line);transition:background-color .35s,color .35s,border-color .35s,transform .5s var(--ease-spring)}
.step.is-done .step-n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.is-current{color:var(--ink)}
.step.is-current .step-n{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.06)}
.step-txt{display:flex;flex-direction:column;line-height:1.2}
.step-v{display:none}
@media(max-width:899px){
  .step:not(.is-current){padding:6px}
  .step:not(.is-current) .step-txt{display:none}
}
@media(min-width:900px){
  .stepper{border-radius:24px;padding:7px;overflow:visible}
  .stepper ol{flex-direction:column;gap:2px}
  .stepper-pill{border-radius:17px}
  .step{width:100%;border-radius:17px;padding:10px 12px}
  .step-v{display:block;margin-top:3px;font-size:.78rem;font-weight:600;color:var(--muted);transition:color .3s}
}

.wz-main{position:relative;padding:clamp(20px,4vw,40px);min-width:0}
.wz-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.progress{flex:1;height:5px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.progress>span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#F5A524);transition:width .8s var(--ease-out)}
.stage{position:relative;overflow:hidden;margin:-8px -14px;padding:8px 14px}
.pane-title{font-size:clamp(2rem,5vw,3.1rem);outline:none}
.pane-desc{margin-top:10px;max-width:58ch;color:var(--muted)}
.pane-body{margin-top:28px}
.wz-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
@media(max-width:899px){
  .wz-nav{position:sticky;bottom:0;z-index:5;margin:28px calc(-1*clamp(20px,4vw,40px)) calc(-1*clamp(20px,4vw,40px));padding:14px clamp(20px,4vw,40px) calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in oklab,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:0 0 var(--r-xl) var(--r-xl)}
}

/* étape 1 : jours */
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.days-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:6px 6px 6px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);transition:background-color .3s,border-color .3s,box-shadow .4s var(--ease-out)}
.dayrow.is-on{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.day-chk{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer;font-weight:750;font-size:1rem}
.seg-wrap{opacity:0;visibility:hidden;transform:translateX(14px);transition:opacity .3s var(--ease-out),transform .5s var(--ease-out),visibility 0s linear .3s}
.dayrow.is-on .seg-wrap{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--bg-2);min-width:300px}
.seg label{position:relative;z-index:1;cursor:pointer}
.seg label span{display:grid;place-items:center;min-height:36px;padding:0 .8rem;border-radius:10px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap;transition:color .3s}
.seg input:checked + span{color:var(--ink)}
.seg input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:-2px}
.seg-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--raise);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transform:translateX(calc(var(--i,1)*100%));transition:transform .55s var(--ease-spring)}
.dayrow[data-m="lunch"] .seg-thumb{--i:0}
.dayrow[data-m="both"] .seg-thumb{--i:2}
@media(max-width:620px){
  .dayrow{grid-template-columns:1fr;gap:0;padding:4px 8px 4px 14px}
  .seg-wrap{display:grid;grid-template-rows:0fr;transform:none;transition:grid-template-rows .5s var(--ease-out),opacity .3s,visibility 0s linear .5s}
  .dayrow.is-on .seg-wrap{grid-template-rows:1fr}
  .seg-clip{overflow:hidden;min-height:0}
  .seg{min-width:0;margin:2px 0 8px}
}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:18px}
.bulk>span{font-size:.86rem;color:var(--muted)}
.bulk-btns{display:flex;flex-wrap:wrap;gap:6px}
.summary{display:flex;align-items:center;gap:10px;margin-top:20px;font-weight:700}
.summary svg{color:var(--ok);flex:none}
.summary.is-empty svg{color:var(--warn)}

/* étape 2 : personnes */
.people{display:flex;align-items:center;justify-content:center;gap:clamp(18px,6vw,48px);padding:8px 0}
.round{width:64px;height:64px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-sm);font-size:1.7rem;line-height:1;transition:transform .45s var(--ease-spring),border-color .2s,background-color .2s}
.round:hover:not(:disabled){transform:scale(1.07);border-color:var(--line-2)}
.round:active:not(:disabled){transform:scale(.9)}
.round:disabled{opacity:.3;cursor:not-allowed}
.num-window{overflow:hidden;text-align:center;padding:0 4px}
.num-input{width:2.2ch;padding:0;border:0;background:none;color:var(--ink);font:600 clamp(5rem,16vw,7.8rem)/1 var(--font-display);letter-spacing:-.05em;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-input:focus{outline:none}
.num-window:focus-within{border-radius:12px;box-shadow:0 0 0 2.5px var(--accent)}
.people-label{text-align:center;color:var(--muted);font-weight:700;margin-top:4px}
.plates{display:flex;justify-content:center;gap:10px;margin-top:22px}
.plate{width:14px;height:14px;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);transition:background-color .3s,border-color .3s,transform .55s var(--ease-spring);transition-delay:calc(var(--k)*28ms)}
.plate.on{background:var(--accent);border-color:var(--accent);transform:scale(1.2)}
.hint{margin:26px auto 0;max-width:48ch;text-align:center;color:var(--ink-2)}
.hint strong{font-weight:800}

/* étape 3 : budget */
.budget-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.money{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.money input{width:3.4ch;padding:0 0 4px;border:0;border-bottom:2px solid var(--line-2);background:none;color:var(--ink);font:600 clamp(3.2rem,9vw,4.6rem)/1 var(--font-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;transition:border-color .25s}
.money input::-webkit-outer-spin-button,.money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money input:focus{outline:none;border-color:var(--accent)}
.money .cur{font:600 2rem var(--font-display);color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.range{--p:26%;display:block;width:100%;height:30px;margin:26px 0 4px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.range:focus{outline:none}
.range::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ink) var(--p),var(--bg-2) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--raise);border:2px solid var(--ink);box-shadow:var(--shadow-md);transition:transform .35s var(--ease-spring)}
.range:active::-webkit-slider-thumb{transform:scale(1.18)}
.range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 45%,transparent)}
.range::-moz-range-track{height:8px;border-radius:99px;background:var(--bg-2)}
.range::-moz-range-progress{height:8px;border-radius:99px;background:var(--ink)}
.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--raise);border:2px solid var(--ink);box-shadow:var(--shadow-md)}
.range-scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.per-card{margin-top:26px;padding:22px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line)}
.per-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:6px}
.per-num{font:600 clamp(2.4rem,6vw,3.2rem)/1 var(--font-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.gauge{position:relative;display:flex;gap:3px;height:10px;margin:30px 0 10px}
.gauge i{display:block;height:100%;border-radius:99px}
.gauge .g1{width:30%;background:#2F9A63}.gauge .g2{width:30%;background:#D9921A}.gauge .g3{width:40%;background:#8A5CF0}
.marker{position:absolute;top:50%;left:0;width:22px;height:22px;border-radius:50%;background:var(--raise);border:3px solid var(--ink);box-shadow:var(--shadow-md);transform:translate(-50%,-50%);transition:left .7s var(--ease-spring)}
.gauge-labels{position:relative;height:18px;font-size:.75rem;font-weight:600;color:var(--muted)}
.gauge-labels span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.gauge-labels span:first-child{transform:none}
.gauge-labels span:last-child{transform:translateX(-100%)}
.b-text{margin-top:14px;color:var(--ink-2)}
#b-warn{margin-top:14px}

/* étapes 4 à 6 : options */
.opts{display:grid;gap:10px}
@media(min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:block;cursor:pointer}
.opt-body{display:flex;align-items:flex-start;gap:14px;height:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .25s,background-color .25s,box-shadow .4s var(--ease-out),transform .5s var(--ease-spring)}
.opt:hover .opt-body{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow-md)}
.opt:active .opt-body{transform:scale(.985)}
.opt input:checked + .opt-body{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--shadow-md)}
.opt input:focus-visible + .opt-body{outline:2.5px solid var(--accent);outline-offset:3px}
.opt-ico{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:color-mix(in oklab,var(--c,var(--ink)) 13%,var(--surface));color:color-mix(in oklab,var(--c,var(--ink)) 75%,var(--ink));transition:transform .6s var(--ease-spring)}
.opt:hover .opt-ico{transform:rotate(-8deg) scale(1.06)}
.cat-dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in oklab,var(--c) 22%,transparent)}
.opt-txt{flex:1;min-width:0}
.opt-title{display:block;font-weight:750}
.opt-desc{display:block;margin-top:2px;font-size:.87rem;color:var(--muted)}
.pool{margin-top:22px}

/* ============================================================
   PLANNING
   ============================================================ */
.plan{padding:32px 0 96px}
.plan-hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;margin-bottom:28px}
.plan-hero h1{font-size:clamp(2.7rem,7.5vw,4.8rem);letter-spacing:-.045em;margin-top:10px;outline:none}
.plan-hero h1 em{color:var(--accent-text)}
.plan-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.plan-actions{display:flex;flex-wrap:wrap;gap:8px}
.plan-actions .btn svg{flex:none;transition:transform .6s var(--ease-spring)}

.stats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:900px){.stats{grid-template-columns:2fr 1fr 1fr}}
.stat{padding:20px 22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stat-cost{grid-column:1/-1}
@media(min-width:900px){.stat-cost{grid-column:auto}}
.stat-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat-num{margin-top:10px;font:600 clamp(2.1rem,5vw,3.1rem)/1 var(--font-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums;transition:color .4s}
.stat-num small{font:700 .95rem var(--font-sans);letter-spacing:0;color:var(--muted)}
.stat-of{font:700 1rem var(--font-sans);letter-spacing:0;color:var(--muted);margin-left:8px}
.stat-cost.is-over .stat-num>span:first-child{color:var(--err)}
.meter{height:8px;margin:16px 0 12px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.meter>span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2F9A63,#8DC63F);transition:width 1.1s var(--ease-out)}
.stat-cost.is-over .meter>span{background:linear-gradient(90deg,#F5A524,#D9481E)}
.stat-note b{font-weight:800}
.alerts{display:grid;gap:10px;margin-top:14px}
.alerts:empty{display:none}

.daynav{position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top,0px));z-index:30;margin:22px 0 0;padding:10px 0}
.daynav-track{position:relative;display:flex;gap:2px;width:max-content;max-width:100%;padding:5px;border-radius:999px;background:color-mix(in oklab,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-md);overflow-x:auto;scrollbar-width:none}
.daynav-track::-webkit-scrollbar{display:none}
.daynav-pill{position:absolute;top:0;left:0;z-index:0;border-radius:999px;background:var(--ink);transition:transform .6s var(--ease-spring),width .5s var(--ease-out),height .5s var(--ease-out)}
.daynav button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;font-weight:800;font-size:.87rem;color:var(--muted);white-space:nowrap;transition:color .3s}
.daynav button:hover{color:var(--ink)}
.daynav button.is-active{color:var(--bg)}
.daynav small{font-size:.72rem;font-weight:700;opacity:.65}

.days{display:grid;gap:40px;margin-top:18px}
.day{scroll-margin-top:calc(var(--header-h) + 84px)}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.day-head h2{font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.035em}
.day-meta{font-size:.86rem;font-weight:700;color:var(--muted);white-space:nowrap}
@media(min-width:1024px){
  .day{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}
  .day-head{position:sticky;top:calc(var(--header-h) + 96px);align-self:start;flex-direction:column;gap:6px;border:0;padding:0}
}
.meals{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}

.meal{--c:#888;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .55s var(--ease-spring),box-shadow .45s var(--ease-out),border-color .3s}
.meal:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--line-2)}
.meal-open{flex:1;display:flex;align-items:flex-start;gap:16px;width:100%;padding:16px;text-align:left;border-radius:var(--r-lg) var(--r-lg) 0 0}
.meal-open:focus-visible{outline-offset:-4px}
.meal-art{width:72px;height:72px;flex:none;border-radius:22px;display:grid;place-items:center;font-size:2.1rem;line-height:1;color:var(--muted);background:radial-gradient(circle at 30% 25%,color-mix(in oklab,var(--c) 30%,var(--surface)),color-mix(in oklab,var(--c) 12%,var(--surface)));transition:transform .7s var(--ease-spring)}
.meal:hover .meal-art{transform:rotate(-7deg) scale(1.07)}
.meal-body{flex:1;min-width:0}
.meal-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meal-kicker .cat{display:inline-flex;align-items:center;gap:6px;color:color-mix(in oklab,var(--c) 70%,var(--ink));letter-spacing:.06em}
.meal-kicker .cat i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.meal-name{display:block;margin-top:6px;font-weight:750;font-size:1.04rem;line-height:1.3;letter-spacing:-.01em}
.meal-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px 9px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.swap{display:inline-flex;align-items:center;gap:7px;flex:none;padding:7px 11px;border-radius:999px;font-size:.84rem;font-weight:750;color:var(--ink-2);transition:background-color .2s,color .2s}
.swap:hover{background:var(--bg-2);color:var(--ink)}
.meal-empty{border-style:dashed;background:transparent;box-shadow:none}
.meal-empty .meal-art{background:var(--bg-2)}
.meal-empty .meal-open{cursor:default}
.pre-reveal{opacity:0}

/* ============================================================
   MODALES (feuille glissante)
   ============================================================ */
#modal-root{position:fixed;inset:0;z-index:60;pointer-events:none}
#modal-root:empty{display:none}
.overlay{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:auto}
.sheet-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 24px);pointer-events:none}
.sheet{--pad:clamp(18px,5vw,32px);position:relative;display:flex;flex-direction:column;width:100%;max-height:92dvh;max-height:92vh;overflow:hidden;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);pointer-events:auto;outline:none}
@supports(height:1dvh){.sheet{max-height:92dvh}}
.grab{position:absolute;top:0;left:0;right:0;z-index:3;height:26px;display:flex;justify-content:center;padding-top:9px;cursor:grab;touch-action:none}
.grab span{width:44px;height:5px;border-radius:99px;background:color-mix(in oklab,var(--ink) 25%,transparent)}
.sheet-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--pad) calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px var(--pad) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
@media(min-width:720px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{--pad:36px;width:min(720px,100%);max-height:min(88vh,920px);border-radius:28px}
  .sheet.wide{width:min(980px,100%)}
  .grab{display:none}
  .sheet-scroll{padding-bottom:34px}
  .sheet-foot{padding-bottom:16px}
}
.x-btn{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--surface) 80%,transparent);border:1px solid var(--line);transition:transform .5s var(--ease-spring),background-color .2s}
.x-btn:hover{transform:rotate(90deg);background:var(--surface)}

/* recette */
.rcp-hero{position:relative;display:flex;align-items:flex-start;gap:16px;margin:0 calc(-1*var(--pad));padding:34px var(--pad) 26px;background:linear-gradient(165deg,color-mix(in oklab,var(--c) 24%,var(--surface)),var(--surface) 80%)}
.rcp-art{width:84px;height:84px;flex:none;border-radius:26px;display:grid;place-items:center;font-size:2.6rem;background:color-mix(in oklab,var(--c) 18%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 25%,transparent)}
.rcp-head{flex:1;min-width:0}
.rcp-head h2{margin:8px 0 14px;font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.035em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 30px}
@media(min-width:720px){.facts{grid-template-columns:repeat(6,minmax(0,1fr))}}
.fact{padding:12px 12px 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.fact dd{margin:0;font:600 1.25rem/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fact dt{margin-top:4px;font-size:.74rem;font-weight:650;color:var(--muted)}
.rcp-cols{display:grid;gap:30px}
@media(min-width:880px){.rcp-cols{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:40px}}
.rcp-cols h3{font-size:1.45rem;margin-bottom:14px}
.rcp-cols h3 span{font:700 .9rem var(--font-sans);letter-spacing:0}
.ing-list{list-style:none;margin:0 0 14px;padding:0}
.ing-list li{display:grid;grid-template-columns:minmax(76px,auto) 1fr;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ing-q{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.steps-tl{list-style:none;margin:0 0 14px;padding:0;counter-reset:s}
.steps-tl li{counter-increment:s;position:relative;display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:22px}
.steps-tl li::before{content:counter(s);position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:800;font-size:.85rem}
.steps-tl li::after{content:"";position:absolute;left:16.5px;top:38px;bottom:4px;width:1.5px;background:var(--line-2)}
.steps-tl li:last-child::after{display:none}
.steps-tl p{padding-top:5px}


/* difficulté, apprentissage, astuces */
.diff .dots{display:inline-flex;gap:2px;margin-right:2px}
.diff .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.diff[data-d="1"] .dots i:nth-child(-n+1),.diff[data-d="2"] .dots i:nth-child(-n+2),.diff[data-d="3"] .dots i{background:var(--accent)}
.rcp-cost{margin-top:10px;font-size:.84rem;font-weight:700;color:var(--muted)}
.learn{margin:-12px 0 28px;padding:16px 18px;border-radius:16px;background:color-mix(in oklab,var(--accent) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--accent) 18%,transparent)}
.learn ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.learn li{padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:700}
.steps-tl li>div{padding-top:5px}
.steps-tl .step-title{display:block;margin-bottom:3px;font-weight:800;letter-spacing:-.005em}
.steps-tl p{padding-top:0;color:var(--ink-2)}
.tips{margin:4px 0 18px;padding:16px 18px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--line-2)}
.tips ul{margin:8px 0 0;padding-left:18px;display:grid;gap:8px;font-size:.92rem}
.stat-cost.is-gastro .meter>span{background:linear-gradient(90deg,#9B2C4F,#D9921A)}

/* courses */
.shop-head{display:flex;align-items:center;gap:16px;padding-top:34px}
.shop-title{flex:1;min-width:0}
.shop-title h2{font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:-.035em}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring-track{stroke:var(--bg-2)}
.ring-fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease-out)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums}
.aisle{margin-top:26px}
.aisle-title{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line);font:800 .74rem var(--font-sans);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.aisle-title>span:first-child{display:flex;align-items:center;gap:8px}
.aisle-title i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.aisle ul{list-style:none;margin:4px 0 0;padding:0}
.check{display:flex;align-items:center;gap:14px;min-height:48px;margin:0 -10px;padding:6px 10px;border-radius:12px;cursor:pointer;transition:background-color .2s}
.check:hover{background:var(--surface-2)}
.check .qty{min-width:5rem;font-weight:800;font-variant-numeric:tabular-nums;transition:color .3s}
.check .txt{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.5px;transition:background-size .45s var(--ease-out),color .3s}
.check input:checked ~ .txt{color:var(--muted);background-size:100% 1.5px}
.check input:checked ~ .qty{color:var(--muted)}
.copy-fallback{margin-top:20px}
.copy-fallback textarea{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:500 .9rem/1.5 ui-monospace,Menlo,monospace}

/* ============================================================
   TOAST
   ============================================================ */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:80;max-width:calc(100vw - 32px);padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.9rem;text-align:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transform:translate(-50%,24px) scale(.94);transition:opacity .25s,transform .55s var(--ease-spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media(max-width:899px){body.in-wizard #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}

/* ============================================================
   ACCESSIBILITÉ / IMPRESSION
   ============================================================ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
}
@media print{
  body::before,.topbar,.daynav,.plan-actions,.meal-foot .swap,#toast,.no-print{display:none!important}
  .pre-reveal{opacity:1!important}
  .meal,.stat{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}

/* ============================================================
   v3 : navigation, catalogue, progression, mode cuisine
   ============================================================ */
@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-wght-italic.woff2") format("woff2");font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:"Manrope";src:url("fonts/manrope-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-style:normal;font-display:swap}

/* onglets */
.tabs{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg-2);margin-left:auto}
.tabs-pill{position:absolute;top:0;left:0;border-radius:999px;background:var(--raise);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transition:transform .55s var(--ease-spring),width .45s var(--ease-out),height .45s var(--ease-out)}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-weight:750;font-size:.88rem;color:var(--muted);transition:color .3s}
.tab:hover{color:var(--ink)}
.tab.is-active{color:var(--ink)}
.tab svg{flex:none}
.tagline{display:none!important}
.theme-btn{margin-left:0}
.install-btn{white-space:nowrap}
@media(max-width:719px){
  .topbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;margin:0;justify-content:space-between;border-radius:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(0,0,0,.35)}
  .tabs-pill{border-radius:14px;box-shadow:none;background:var(--bg-2)}
  .tab{flex:1;justify-content:center;flex-direction:column;gap:2px;padding:7px 4px;border-radius:14px;font-size:.72rem}
  .theme-btn{margin-left:auto}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  body.in-wizard{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .wz-nav{position:fixed!important;left:auto;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px))!important;z-index:44;width:auto;margin:0!important;padding:0!important;gap:10px;justify-content:flex-end;border:0!important;border-radius:0!important;background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .wz-nav .btn{--h:54px;width:54px;padding:0;border-radius:50%;box-shadow:var(--shadow-lg)}
  .wz-nav .btn > span:not(.arrow){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .wz-nav .btn .arrow svg{width:22px;height:22px}
  .wz-nav #back{background:var(--surface);border-color:var(--line-2)}
  .wz-nav #back.is-hidden{display:none}
  .wz-nav.is-last{position:static!important;margin:28px 0 0!important;justify-content:space-between}
  .wz-nav.is-last .btn-final{flex:1;width:auto;--h:56px;padding:0 1.4rem;border-radius:999px}
  .wz-nav.is-last .btn-final > span.lbl{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  .wz-main{padding-bottom:clamp(20px,4vw,40px)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  body.in-wizard #toast{bottom:calc(156px + env(safe-area-inset-bottom,0px))!important}
  .install-btn span{display:none}
}
.btn-sm{--h:38px;padding:0 .95rem;font-size:.86rem}
.back-plan{margin-top:16px}
.chip-sm{min-height:32px;padding:0 .75rem;font-size:.8rem}
.chip svg{flex:none}
.field{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-weight:600}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}

/* interrupteur */
.switch-row{display:flex;align-items:center;gap:16px;margin-top:18px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.sw-txt{flex:1;min-width:0}
.switch{position:relative;flex:none;width:48px;height:28px;border-radius:99px;background:var(--line-2);transition:background-color .3s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .45s var(--ease-spring)}
.switch-row input:checked + .switch{background:var(--ink)}
.switch-row input:checked + .switch i{transform:translateX(20px);background:var(--bg)}
.switch-row input:focus-visible + .switch{outline:2.5px solid var(--accent);outline-offset:3px}
.sum-note{display:block;flex-basis:100%;font-weight:500;margin-top:4px}
.summary{flex-wrap:wrap}

/* exclusions et préférences */
.exclude{margin-top:22px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2)}
.ex-form{display:flex;gap:8px;margin-top:10px}
.ex-form .field{flex:1;min-width:0}
.ex-chips,.ex-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.ex-chips svg{width:13px;height:13px}
.prefs{margin-top:26px}
.prefs>.eyebrow{margin-bottom:8px}
.seg-level{min-width:0;grid-template-columns:repeat(4,1fr);margin-bottom:8px}
.seg-level .seg-thumb{width:calc((100% - 8px)/4);transform:translateX(calc(var(--i,0)*100%))}
.seg-level[data-lv="1"] .seg-thumb{--i:1}.seg-level[data-lv="2"] .seg-thumb{--i:2}.seg-level[data-lv="all"] .seg-thumb{--i:3}
@media(max-width:520px){.seg-level label span{padding:0 .3rem;font-size:.76rem}}

/* planning : restes, anticipation */
.foot-actions{display:flex;align-items:center;gap:2px;flex:none}
.meal-foot{flex-wrap:wrap}
.x2{display:inline-flex;padding:2px 8px;border-radius:99px;background:color-mix(in oklab,var(--accent) 14%,var(--surface));color:var(--accent-text);letter-spacing:.04em}
.meal-left{background:var(--surface-2);box-shadow:none}
.meal-left .meal-art{background:var(--bg-2);color:var(--muted)}
.meal-art.small{width:52px;height:52px;border-radius:16px;font-size:1.5rem}
.tag-warn{background:color-mix(in oklab,#D9921A 14%,var(--surface));color:color-mix(in oklab,#D9921A 55%,var(--ink));border-color:transparent}
.fav{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--muted);transition:color .2s,background-color .2s}
.fav:hover{background:var(--bg-2);color:var(--ink)}
.fav.is-on{color:#E5533D}
.fav.is-on svg{fill:currentColor}
.fav-lg{width:48px;height:48px;border:1px solid var(--line);margin-right:auto}
.ahead{margin-top:16px;padding:18px 20px}
.ahead-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ahead-head h2{font-size:1.3rem}
.ahead-head .muted{margin-left:auto}
.ahead-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ahead-list li{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 0;border-top:1px dashed var(--line)}
.ahead-list li>span:last-child{display:flex;flex-direction:column;gap:2px}
.ahead-when{font-weight:800;font-size:.86rem;color:var(--accent-text)}
@media(max-width:560px){.ahead-list li{grid-template-columns:1fr;gap:2px}}

/* catalogue */
.catalog,.progress-view{padding:32px 0 96px}
.cat-hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:20px}
.cat-hero h1{font-size:clamp(2.4rem,6.5vw,4rem);letter-spacing:-.045em;margin-top:8px;outline:none}
.cat-hero h1 em{color:var(--accent-text)}
.search{display:flex;align-items:center;gap:10px;flex:1;max-width:440px;min-width:240px;height:50px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--muted);transition:border-color .2s,box-shadow .3s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;outline:none}
.filters{padding:14px 18px;display:grid;gap:10px}
.frow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
.flabel{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:9px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fsep{width:1px;height:22px;background:var(--line);margin:0 4px}
@media(max-width:560px){.frow{grid-template-columns:1fr}.flabel{padding-top:0}}
.cat-count{margin:18px 2px 10px;font-weight:700;color:var(--muted);font-size:.9rem}
.rgrid{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.rcard{position:relative;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .55s var(--ease-spring),box-shadow .4s var(--ease-out),border-color .3s}
.rcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line-2)}
.rcard.is-used{opacity:.55}
.rcard-open{display:flex;gap:14px;width:100%;padding:14px 52px 14px 14px;text-align:left;border-radius:var(--r-lg)}
.rcard-open:focus-visible{outline-offset:-4px}
.rcard .meal-art{width:60px;height:60px;border-radius:18px;font-size:1.8rem}
.rcard .meal-name{font-size:.98rem}
.fav-float{position:absolute;top:10px;right:10px}
.cooked{display:inline-flex;align-items:center;gap:4px;color:var(--ok);letter-spacing:.04em}
.empty-cat{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-lg)}
.picker-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;margin-bottom:20px;border-color:color-mix(in oklab,var(--accent) 35%,var(--line));background:color-mix(in oklab,var(--accent) 7%,var(--surface))}
.picker-bar>span{display:flex;gap:10px;align-items:flex-start}
.picker-bar svg{flex:none;margin-top:3px;color:var(--accent-text)}

/* progression */
.level-card{display:flex;gap:20px;align-items:center;padding:24px;margin-bottom:12px}
.level-badge{width:76px;height:76px;flex:none;border-radius:24px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.level-badge svg{width:38px;height:38px}
.level-main{flex:1;min-width:0}
.level-name{font:600 clamp(2rem,5vw,2.8rem)/1 var(--font-display);letter-spacing:-.035em;margin-top:6px}
.level-card .meter>span{background:linear-gradient(90deg,var(--accent),#F5A524)}
.prog-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px}
@media(max-width:600px){.prog-stats{grid-template-columns:1fr 1fr}.prog-stats .stat:first-child{grid-column:1/-1}}
.prog-stats .stat-cost{grid-column:auto}
.challenge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px;margin-bottom:12px;background:linear-gradient(120deg,color-mix(in oklab,var(--c) 14%,var(--surface)),var(--surface) 70%)}
.ch-name{font:600 1.4rem/1.15 var(--font-display);letter-spacing:-.02em;margin:6px 0 4px}
.skills,.history{padding:20px 22px;margin-bottom:12px}
.skills h2,.history h2{font-size:1.4rem;margin-bottom:12px}
.skills h3{margin:18px 0 8px}
.skill-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.skill-list li{padding:5px 12px;border-radius:999px;border:1px dashed var(--line-2);font-size:.82rem;font-weight:650;color:var(--muted)}
.skill-list li.on{border-style:solid;border-color:transparent;background:color-mix(in oklab,var(--ok) 14%,var(--surface));color:color-mix(in oklab,var(--ok) 60%,var(--ink))}
.hist-list{list-style:none;margin:0 0 14px;padding:0}
.hist-list li+li{border-top:1px solid var(--line)}
.hist-list button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;text-align:left;border-radius:12px}
.hist-list button:hover{background:var(--surface-2)}
.hist-list .meal-art{background:color-mix(in oklab,var(--c) 16%,var(--surface))}
.hist-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.stars-ro{color:#F5A524;letter-spacing:2px;white-space:nowrap}

/* fiche : note, pied */
.rate-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stars{display:flex;gap:2px}
.star{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--line-2);transition:color .2s}
.star.on{color:#F5A524}
.star:hover{color:#F5A524}
.sheet-foot{align-items:center}
.sheet .alert{margin:0 0 12px}
.pack{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin-top:1px}
.check .txt{line-height:1.3}
.pantry-note{margin:8px 0 6px}
.pantry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 12px}
.check-sm{min-height:40px}
.check-sm .tick{width:20px;height:20px;border-radius:6px}

/* mode cuisine */
#cook-root:empty{display:none}
.cook{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) calc(12px + env(safe-area-inset-bottom,0px))}
.cook::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(900px 500px at 0% 0%,color-mix(in oklab,var(--c) 16%,transparent),transparent 65%)}
.cook-top{display:flex;align-items:center;gap:14px;max-width:880px;width:100%;margin:0 auto}
.cook-name{flex:1;min-width:0}
.cook-name p:last-child{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-wake{white-space:nowrap}
@media(max-width:560px){.cook-wake{display:none}}
.cook-progress{max-width:880px;width:100%;margin:14px auto 0;height:5px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.cook-progress span{display:block;height:100%;width:0;background:var(--c);transition:width .6s var(--ease-out)}
.cook-stage{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;max-width:880px;width:100%;margin:0 auto;padding:clamp(20px,5vh,56px) 4px 20px;touch-action:pan-y}
.cook-pane{max-width:760px}
.cook-step-n{font-size:.8rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.cook-step-title{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.04em;margin:10px 0 18px}
.cook-text{font-size:clamp(1.2rem,2.6vw,1.6rem);line-height:1.5;color:var(--ink);font-weight:500}
.cook-tbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.cook-ing{list-style:none;margin:0;padding:0;columns:2 260px;column-gap:24px}
.cook-ing li{break-inside:avoid}
.cook-ing .check{font-size:1.08rem}
.cook-end{display:grid;gap:14px;justify-items:start}
.cook-end .star{width:52px;height:52px}
.cook-end .star svg{width:34px;height:34px}
.cook-timers{display:flex;flex-wrap:wrap;gap:8px;max-width:880px;width:100%;margin:0 auto}
.cook-timers:empty{display:none}
.ctimer{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.ctimer::before{content:"";position:absolute;inset:0;z-index:0;background:color-mix(in oklab,var(--c) 18%,transparent);transform-origin:left;transform:scaleX(var(--p,0%));width:100%}
.ctimer>*{position:relative;z-index:1}
.ctimer::before{transform:none;width:var(--p,0%)}
.ct-label{font-size:.8rem;font-weight:700;color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-time{font:700 1.15rem var(--font-sans);font-variant-numeric:tabular-nums}
.ct-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2)}
.ctimer.is-done{border-color:var(--accent);animation:ring 1s ease-in-out infinite}
.ctimer.is-paused .ct-time{opacity:.5}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 50%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.cook-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:880px;width:100%;margin:12px auto 0;padding-top:12px;border-top:1px solid var(--line)}
.cook-count{white-space:nowrap;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.cook-nav .btn{min-width:140px}
</style>
</head>

<a class="skip" href="#main">Aller au contenu</a>
<header class="topbar" id="topbar">
  <div class="shell topbar-in">
    <span class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 56 56" width="34" height="34"><rect width="56" height="56" rx="15" fill="var(--ink)"/><path d="M14 28h28v6a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8Z" fill="var(--accent)"/><path d="M11 28h34" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round"/><g class="steam" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round"><path d="M22 13c-2 2.5 2 4.5 0 7.5"/><path d="M28 11c-2 2.5 2 4.5 0 7.5"/><path d="M34 13c-2 2.5 2 4.5 0 7.5"/></g></svg></span>Mijote</span>
    <nav class="tabs" id="tabs" aria-label="Navigation principale"><span class="tabs-pill" aria-hidden="true"></span>
      <button type="button" class="tab" data-tab="plan"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Planning</span></button>
      <button type="button" class="tab" data-tab="catalog"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19V5M8 7h7"/></svg><span>Recettes</span></button>
      <button type="button" class="tab" data-tab="progress"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17v-4.2A4 4 0 0 1 8.5 5 4.5 4.5 0 0 1 12 3.5 4.5 4.5 0 0 1 15.5 5 4 4 0 0 1 17 12.8V17Z"/><path d="M7 20h10"/></svg><span>Progression</span></button>
    </nav>
    <button type="button" class="btn btn-ghost btn-sm install-btn" id="install-btn" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Installer</span></button>
    <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Basculer entre thème clair et sombre">
      <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>
<main id="main" class="shell"><div id="view"></div></main>
<div id="modal-root"></div>
<div id="cook-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data/recipes.js"></script>

<script src="app.js"></script>
